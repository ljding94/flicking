name = "flicking"
main = "worker.ts"
compatibility_date = "2025-11-01"

# Static Vite build. Worker handles /api/rooms, then falls through to assets.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "ROOMS"
id = "24d84a96437d4f428fa57093ee7fa8ac"
preview_id = "24d84a96437d4f428fa57093ee7fa8ac"
